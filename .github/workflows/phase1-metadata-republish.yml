name: Corregir metadatos candidato Fase 1

on:
  push:
    branches: [fase-1-estabilizacion-v1.0.3]
    paths:
      - '.github/workflows/phase1-metadata-republish.yml'

permissions:
  contents: write
  actions: read

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener rama candidata
        uses: actions/checkout@v4
        with:
          ref: fase-1-estabilizacion-v1.0.3

      - name: Descargar APK ya compilado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8712760653/zip" \
            --output /tmp/source-artifact.zip
          mkdir -p deliverable
          unzip -q /tmp/source-artifact.zip -d deliverable

      - name: Verificar APK y corregir metadatos
        shell: bash
        run: |
          set -euo pipefail
          APK=deliverable/Oraculo-Tarot-Laura-v1.0.3-debug.apk
          METADATA=deliverable/Oraculo-Tarot-Laura-v1.0.3-debug-metadata.txt
          test -s "$APK"
          unzip -tq "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "package: name='cl.oraculotarotlaura.app' versionCode='4' versionName='1.0.3'" /tmp/apk-badging.txt

          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          if grep -Fq 'android.permission.INTERNET' /tmp/apk-permissions.txt; then
            echo 'El APK solicita permiso de Internet.' >&2
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          CARD_COUNT=$(unzip -Z1 "$APK" | grep -Ec '^assets/assets/cards/[0-9]{2}-.*\.svg$')
          test "$CARD_COUNT" -eq 22

          SIZE=$(stat --format='%s' "$APK")
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          CERT_SHA256=$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' /tmp/apk-signature.txt)
          test -n "$CERT_SHA256"

          cat > "$METADATA" <<META
          name=Oraculo-Tarot-Laura-v1.0.3-debug.apk
          size_bytes=$SIZE
          sha256=$SHA256
          application_id=cl.oraculotarotlaura.app
          version_code=4
          version_name=1.0.3
          certificate_sha256=$CERT_SHA256
          internet_permission=false
          card_count=$CARD_COUNT
          build_variant=debug
          source_build_run=30423546261
          META

          grep -F "certificate_sha256=$CERT_SHA256" "$METADATA"
          cat "$METADATA"

      - name: Publicar APK y metadatos corregidos
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oraculo-Tarot-Laura-v1.0.3-debug
          path: |
            deliverable/Oraculo-Tarot-Laura-v1.0.3-debug.apk
            deliverable/Oraculo-Tarot-Laura-v1.0.3-debug-metadata.txt
          if-no-files-found: error
          retention-days: 30

      - name: Registrar evidencia temporal
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          METADATA=deliverable/Oraculo-Tarot-Laura-v1.0.3-debug-metadata.txt
          SIZE=$(awk -F= '$1 == "size_bytes" {print $2}' "$METADATA")
          SHA256=$(awk -F= '$1 == "sha256" {print $2}' "$METADATA")
          CERT_SHA256=$(awk -F= '$1 == "certificate_sha256" {print $2}' "$METADATA")
          cat > PHASE1_ARTIFACT_REPORT.md <<REPORT
          # Evidencia temporal del artefacto Fase 1

          - run_id: \`$RUN_ID\`
          - artifact_id: \`$ARTIFACT_ID\`
          - artifact_name: \`Oraculo-Tarot-Laura-v1.0.3-debug\`
          - apk_name: \`Oraculo-Tarot-Laura-v1.0.3-debug.apk\`
          - size_bytes: \`$SIZE\`
          - sha256: \`$SHA256\`
          - certificate_sha256: \`$CERT_SHA256\`
          - application_id: \`cl.oraculotarotlaura.app\`
          - version_code: \`4\`
          - version_name: \`1.0.3\`
          - internet_permission: \`false\`
          - card_count: \`22\`
          REPORT

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE1_ARTIFACT_REPORT.md
          git commit -m 'chore: record corrected phase 1 artifact evidence'
          git push origin HEAD:fase-1-estabilizacion-v1.0.3
