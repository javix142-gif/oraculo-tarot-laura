name: Persistir fuente validada v1.0.1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/persist-v101.yml'

permissions:
  contents: write

concurrency:
  group: persist-v101-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persist:
    if: github.head_ref == 'recovery/v1.0.1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener rama
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruir el árbol ya validado
        shell: bash
        run: |
          set -euo pipefail
          RECOVERY=/tmp/oraculo-persist
          ARCHIVE="$RECOVERY/archive"
          ROOT="$RECOVERY/oraculo-tarot-laura-android"
          WRAPPER="$RECOVERY/wrapper-project"
          PINNED=291469b0af91f4956c95395ac806171a04c24922
          BASE_URL="https://raw.githubusercontent.com/javix142-gif/Prueba-de-Qwen/$PINNED"
          mkdir -p "$ARCHIVE" "$WRAPPER"
          for part in 00 01 02 03 04 05 06; do
            curl --fail --location --retry 3 "$BASE_URL/oraculo-source.part$part" --output "$ARCHIVE/oraculo-source.part$part"
          done
          cat "$ARCHIVE"/oraculo-source.part* > "$RECOVERY/source.tar.gz.b64"
          base64 --decode "$RECOVERY/source.tar.gz.b64" > "$RECOVERY/source.tar.gz"
          echo '9717e9abe9cec937a60e8f609d52f8878cbaff1f114a32a64b56b04f9f4534b6  /tmp/oraculo-persist/source.tar.gz' | sha256sum --check
          tar -xzf "$RECOVERY/source.tar.gz" -C "$RECOVERY"
          curl --fail --location --retry 3 "$BASE_URL/oraculo-android-styles.xml" --output "$RECOVERY/styles.xml"
          cp "$RECOVERY/styles.xml" "$ROOT/app/src/main/res/values/styles.xml"
          cat > "$ROOT/build.gradle" <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.0' apply false
          }
          GRADLE
          printf "rootProject.name = 'wrapper-generator'\n" > "$WRAPPER/settings.gradle"
          printf "\n" > "$WRAPPER/build.gradle"
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output "$RECOVERY/gradle-8.9-bin.zip"
          echo 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  /tmp/oraculo-persist/gradle-8.9-bin.zip' | sha256sum --check
          unzip -q "$RECOVERY/gradle-8.9-bin.zip" -d "$RECOVERY/gradle-dist"
          cd "$WRAPPER"
          "$RECOVERY/gradle-dist/gradle-8.9/bin/gradle" wrapper \
            --gradle-version 8.9 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          mkdir -p "$ROOT/gradle/wrapper"
          cp gradlew gradlew.bat "$ROOT/"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$ROOT/gradle/wrapper/"
          chmod +x "$ROOT/gradlew"
          cp "$ROOT/android-web/index.html" "$ROOT/index.html"
          cp "$ROOT/android-web/styles.css" "$ROOT/styles.css"
          cp "$ROOT/android-web/service-worker.js" "$ROOT/service-worker.js"
          cp "$ROOT/android-web/manifest.webmanifest" "$ROOT/manifest.webmanifest"
          cp "$ROOT/android-web/offline.html" "$ROOT/offline.html"
          rm -rf "$ROOT/js" "$ROOT/assets" "$ROOT/icons" "$ROOT/.gradle" "$ROOT/build" "$ROOT/app/build"
          rm -f "$ROOT/.gitignore"
          cp -a "$ROOT/android-web/js" "$ROOT/js"
          cp -a "$ROOT/android-web/assets" "$ROOT/assets"
          cp -a "$ROOT/android-web/icons" "$ROOT/icons"
          cat "$GITHUB_WORKSPACE"/recovery-patch.part* > "$RECOVERY/v101.patch"
          echo 'ba22ca68716bf8d37ab36ad862ed7e8943799631c91ccec0233f74587b47a7e5  /tmp/oraculo-persist/v101.patch' | sha256sum --check
          cd "$ROOT"
          git apply --check "$RECOVERY/v101.patch"
          git apply "$RECOVERY/v101.patch"
          rm -rf .gradle build app/build .git
          git init -q
          git add -A
          git diff --cached --check
          test "$(git ls-files --cached | wc -l)" -eq 97
          test "$(find assets/cards -maxdepth 1 -name '*.svg' ! -name 'card-back.svg' | wc -l)" -eq 22

      - name: Crear y subir commit completo
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set +e
          (
            set -euxo pipefail
            ROOT=/tmp/oraculo-persist/oraculo-tarot-laura-android
            rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' "$ROOT/" "$GITHUB_WORKSPACE/"
            cd "$GITHUB_WORKSPACE"
            rm -rf .gradle build app/build
            git config user.name 'ChatGPT Recovery'
            git config user.email 'chatgpt-recovery@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'fix: recover complete Android source and apply v1.0.1'
            git push origin "HEAD:$TARGET_BRANCH"
          ) > /tmp/persist-v101.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/persist-v101.status
          exit 0

      - name: Publicar registro de persistencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persist-v101-log
          path: |
            /tmp/persist-v101.log
            /tmp/persist-v101.status
          if-no-files-found: error
          retention-days: 1

      - name: Verificar persistencia
        run: test "$(cat /tmp/persist-v101.status)" = '0'
