name: Construir APK de prueba

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'PROJECT_STATE.md'
      - 'QA_PHASE_1.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar caché Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar pruebas
        run: node --test

      - name: Ensamblar una única variante debug
        run: ./gradlew :app:assembleDebug --build-cache

      - name: Verificar y preparar candidato
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverable
          APK=deliverable/Oraculo-Tarot-Laura-v1.0.3-debug.apk
          METADATA=deliverable/Oraculo-Tarot-Laura-v1.0.3-debug-metadata.txt
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          test -s "$APK"
          unzip -tq "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "package: name='cl.oraculotarotlaura.app' versionCode='4' versionName='1.0.3'" /tmp/apk-badging.txt

          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          if grep -Fq 'android.permission.INTERNET' /tmp/apk-permissions.txt; then
            echo 'El APK solicita permiso de Internet.' >&2
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt

          CARD_COUNT=$(unzip -Z1 "$APK" | grep -Ec '^assets/assets/cards/[0-9]{2}-.*\.svg$')
          test "$CARD_COUNT" -eq 22
          unzip -p "$APK" assets/styles.css | grep -F -- '--android-safe-bottom'
          unzip -p "$APK" assets/styles.css | grep -F 'scroll-padding-bottom'
          unzip -p "$APK" assets/js/app.js | grep -F 'getSelectionProgress'
          unzip -p "$APK" assets/js/app.js | grep -F 'claimReadingCompletion'
          unzip -p "$APK" assets/service-worker.js | grep -F 'oraculo-tarot-laura-v1.0.3'

          SIZE=$(stat --format='%s' "$APK")
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          CERT_SHA256=$(awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}' /tmp/apk-signature.txt)
          test -n "$CERT_SHA256"

          cat > "$METADATA" <<META
          name=Oraculo-Tarot-Laura-v1.0.3-debug.apk
          size_bytes=$SIZE
          sha256=$SHA256
          application_id=cl.oraculotarotlaura.app
          version_code=4
          version_name=1.0.3
          certificate_sha256=$CERT_SHA256
          internet_permission=false
          card_count=$CARD_COUNT
          build_variant=debug
          META

          cat "$METADATA"

      - name: Publicar APK y metadatos
        uses: actions/upload-artifact@v4
        with:
          name: Oraculo-Tarot-Laura-v1.0.3-debug
          path: |
            deliverable/Oraculo-Tarot-Laura-v1.0.3-debug.apk
            deliverable/Oraculo-Tarot-Laura-v1.0.3-debug-metadata.txt
          if-no-files-found: error
          retention-days: 30
