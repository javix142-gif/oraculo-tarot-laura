name: Diagnosticar parche de recuperación

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-patch.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obtener rama
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Publicar huellas del parche
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo '### Diagnóstico del parche de recuperación'
            echo '```text'
            wc -c recovery-patch.part*
            sha256sum recovery-patch.part*
            cat recovery-patch.part* > /tmp/v101.patch
            wc -c /tmp/v101.patch
            sha256sum /tmp/v101.patch
            echo '```'
          } > /tmp/diagnostic.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/diagnostic.md
