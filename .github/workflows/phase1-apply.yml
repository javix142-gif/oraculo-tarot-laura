name: Aplicar Fase 1 controlada

on:
  push:
    branches: [fase-1-estabilizacion-v1.0.3]
    paths:
      - '.github/workflows/phase1-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener rama
        uses: actions/checkout@v4
        with:
          ref: fase-1-estabilizacion-v1.0.3
          fetch-depth: 0

      - name: Verificar y extraer cambios
        shell: bash
        run: |
          set -euo pipefail
          cat QA_PHASE_1.tmp phase1.payload.part01 phase1.payload.part02 phase1.payload.part03 phase1.payload.part04 phase1.payload.part05 | base64 --decode > /tmp/phase1.tar.gz
          echo '9a2f5141d68aa179d34cb930ae881f54d0ca9096a7dd7b4e4d6a13f41db376db  /tmp/phase1.tar.gz' | sha256sum --check
          tar -xzf /tmp/phase1.tar.gz
          rm QA_PHASE_1.tmp phase1.payload.part01 phase1.payload.part02 phase1.payload.part03 phase1.payload.part04 phase1.payload.part05

      - name: Crear commits coherentes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add styles.css android-web/styles.css QA_PHASE_1.tmp phase1.payload.part01 phase1.payload.part02 phase1.payload.part03 phase1.payload.part04 phase1.payload.part05
          git commit -m 'fix: stabilize safe areas and long readings'

          git add js/app.js android-web/js/app.js js/tarot-engine.js android-web/js/tarot-engine.js
          git commit -m 'feat: add guarded three-card selection progress'

          git add tests/tarot-engine.test.mjs tests/static-app.test.mjs tests/android-container.test.mjs
          git commit -m 'test: cover phase 1 selection and layout contracts'

          git add app/build.gradle service-worker.js android-web/service-worker.js
          git commit -m 'chore: prepare v1.0.3 debug candidate'

          git push origin HEAD:fase-1-estabilizacion-v1.0.3
